[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"
exclude = "mkdocs.yml"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = ".+\\.csv"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"

[[repos.hooks]]
id = "ruff"
args = ["--config=pyproject.toml"]

[[repos.hooks]]
id = "ruff-format"
args = ["--config=pyproject.toml"]
