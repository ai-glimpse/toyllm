[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"


[project]
name = "toyllm"
version = "0.1.0"
description = "Toy LLM"
keywords=["machine learning", "deep learning", "llm"]
license = "Apache-2.0"
readme = "README.md"
authors = [
    {name = "Xiangzhuang Shen", email = "datahonor@gmail.com"},
]

classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5.1",
    "torch>=2.13.0",
    "tiktoken>=0.13.0",
    "jaxtyping>=0.3.11",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "beartype>=0.22.9",
    "jupyterlab>=4.6.2",
]

[project.optional-dependencies]
dev = [
    "nvitop>=1.7.1",
    "pre-commit>=4.6.1",
    "ipython>=9.15.0",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "hypothesis>=6.163.0",
    "commitizen>=4.16.5",
    "pandas>=3.0.5",
]
plot = [
    "matplotlib>=3.11.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocstrings>=1.0.6",
    "mkdocs-bibtex>=4.4.0",
    "mkdocstrings-python>=2.0.5",
    "mkdocs-git-committers-plugin-2>=2.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
]
example = [
    "marimo>=0.23.15",
]
finetune = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.25.1",
    "ipywidgets>=8.1.8",
    "peft>=0.20.0",
    "transformers>=5.14.1",
    "trl>=1.9.2",
    "wandb>=0.28.1",
]

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
include = ["toyllm*"]
namespaces = false


# [tool.uv]
# extra-index-url = ["https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"]


[tool.mypy]
strict = true
# exclude all files in playground
exclude = ["playground/*", "toyllm/cli/benchmark*"]
ignore_missing_imports = true
disallow_untyped_decorators = false


# Ruff configuration: https://docs.astral.sh/ruff/configuration/#configuring-ruff
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error
    "F722",   # jaxtyping doc said it's ok to disable this

    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # undocumented-public-init
    "T201",   # print
    "RET504", # Unnecessary assignment before `return` statement
    "ERA001", # Found commented-out code
    "PLR0913", #  Too many arguments in function definition
    "RUF003",  # Comment contains ambiguous(FULLWIDTH COMMA)
    "COM812",
    "RUF001",
    "ANN001",
    "CPY001",  # Missing copyright notice
    "PLR0917", # Too many positional arguments
    "PYI034",  # Self return type for context managers
    "TC001",   # Move application import into a type-checking block
    "TC002",   # Move third-party import into a type-checking block
    "TC003",   # Move standard library import into a type-checking block
    "RUF100",  # Preserve compatibility nosec directives across Ruff versions
    "UP037",   # Preserve quoted forward annotations
    "UP040",   # Prefer the type keyword for type aliases
]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
'playground/glimpse/top-down/*' = ["ALL"]
'playground/finetune/*' = ["ALL"]
'playground/*.ipynb' = ["TRY003", "ANN204", "EM102", "N806"]

'toyllm/cli/benchmark*' = ["ALL"]
'tests/*' = [
    "S101", # assert
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
